# Development environment. Copy .env.example to .env before starting.
# Only services that can run without application code are enabled.

services:
  db-users:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}
      POSTGRES_DB: ${USERS_DB_NAME}
    ports:
      - "${USERS_DB_PORT}:5432"
    volumes:
      - users-data:/var/lib/postgresql/data
      # Init scripts (*.sql, *.sh) are added later in database/users/init
      - ./database/users/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-content:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CONTENT_DB_USER}
      POSTGRES_PASSWORD: ${CONTENT_DB_PASSWORD}
      POSTGRES_DB: ${CONTENT_DB_NAME}
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=5
      -c max_replication_slots=5
      -c hot_standby=on
    ports:
      - "${CONTENT_DB_PORT}:5432"
    volumes:
      - content-data:/var/lib/postgresql/data
      - ./database/content/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-content-replica:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${CONTENT_DB_PASSWORD}
      POSTGRES_USER: ${CONTENT_DB_USER}
      POSTGRES_DB: ${CONTENT_DB_NAME}
    ports:
      - "${CONTENT_REPLICA_DB_PORT:-5435}:5432"
    volumes:
      - content-replica-data:/var/lib/postgresql/data
    depends_on:
      db-content:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          pg_basebackup -h db-content -p 5432 -U "$${POSTGRES_USER}" -D /var/lib/postgresql/data -Fp -Xs -R -S content_replica_slot
          chown -R postgres:postgres /var/lib/postgresql/data
          chmod 700 /var/lib/postgresql/data
        fi
        exec su-exec postgres postgres -c hot_standby=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-activity:
    image: postgres:16-alpine
    container_name: db-activity
    environment:
      POSTGRES_DB: activity_db
      POSTGRES_USER: activity_user
      POSTGRES_PASSWORD: activity_password
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
    ports:
      - "5436:5432"
    volumes:
      - activity-data:/var/lib/postgresql/data
      - ./database/activity/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activity_user -d activity_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-activity-replica:
    image: postgres:16-alpine
    container_name: db-activity-replica
    depends_on:
      db-activity:
        condition: service_healthy
    environment:
      PGPASSWORD: activity_password
    entrypoint:
      - bash
      - -c
      - |
        set -e
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          rm -rf /var/lib/postgresql/data/*
          until pg_basebackup -h db-activity -p 5432 -U activity_user -D /var/lib/postgresql/data -Fp -Xs -P -R -S activity_replica_slot; do
            echo "Waiting for db-activity primary..."
            sleep 2
          done
          chmod 0700 /var/lib/postgresql/data
        fi
        exec docker-entrypoint.sh postgres -c hot_standby=on
    ports:
      - "5437:5432"
    volumes:
      - activity-replica-data:/var/lib/postgresql/data

  # --- Application services ---
  # Behind the "app" profile: not started by a plain `docker compose up`.
  # Start them with `docker compose --profile app up -d` once the code exists.
  backend:
    profiles: ["app"]
    build: ./backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db-users:
        condition: service_healthy
      db-content:
        condition: service_healthy
      db-activity:
        condition: service_healthy
      db-content-replica:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:4200"
    volumes:
      - ./frontend:/app
      # keep container-installed dependencies out of the host bind mount
      - /app/node_modules
    depends_on:
      - backend

volumes:
  users-data:
  content-data:
  content-replica-data:
  activity-data:
  activity-replica-data:
